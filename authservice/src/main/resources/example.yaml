spring:
  application:
    name: authservice
  datasource:
    url: jdbc:mysql://localhost:3306/databasename?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: username
    password: pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

jwt:
  secret: your secret key
  expiration: 86400000
logging:
  level:
    com.shopsphere: DEBUG   # Shows detailed logs for your application code (controllers, services, etc.)

    org.springframework.security: DEBUG   # Shows detailed logs for Spring Security (login, JWT, filters, authentication)

cors:
  allowed-origins: "http://localhost:3000"  # Adjust this to your frontend URL
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "Authorization,Content-Type"