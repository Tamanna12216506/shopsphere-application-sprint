server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/authservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  zipkin:
    base-url: http://localhost:9411
    sender:
      type: web
  sleuth:
    sampler:
      probability: 1.0
jwt:
  secret: 96775a5fb7f56bd254cf601fea198a1234567890abcd
  expiration: 86400000

logging:
  level:
    com.shopsphere: DEBUG
    org.springframework.security: DEBUG

cors:
  allowed-origins: "http://localhost:3000"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "Authorization,Content-Type"
