server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/catlogdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  redis:
    host: localhost
    port: 6379
  cache:
    type: redis

  zipkin:
    base-url: http://localhost:9411
    sender:
      type: web
  sleuth:
      sampler:
        probability: 1.0
logging:
  level:
    com.example.catlogservice: DEBUG
    org.elasticsearch.client: DEBUG
    org.elasticsearch.transport: TRACE
    org.elasticsearch.data.elasticsearch.core.ElasticsearchRestTemplate: DEBUG
